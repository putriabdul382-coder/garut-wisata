<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YUDA NEWS - PREMIUM TEMP MAIL</title>
    <style>
        :root { --p: #bc13fe; --dark: #000; --card: #111; --text: #fff; }
        
        * { box-sizing: border-box; }

        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: var(--dark); 
            color: var(--text); 
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
        }

        /* Navigasi Full Width */
        nav { 
            background: #000; 
            height: 60px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 20px; 
            border-bottom: 2px solid var(--p);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { color: var(--p); font-weight: 900; font-size: 22px; text-decoration: none; text-shadow: 0 0 10px var(--p); }
        .back { color: #fff; text-decoration: none; font-size: 12px; border: 1px solid var(--p); padding: 8px 15px; border-radius: 6px; background: rgba(188, 19, 254, 0.1); }

        /* Container Full Layar */
        .wrapper {
            width: 100%;
            min-height: calc(100vh - 60px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card { 
            width: 100%; 
            max-width: 600px; 
            background: var(--card); 
            padding: 25px; 
            border-radius: 15px; 
            border: 1px solid #222; 
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        /* Box Email Mewah */
        .email-box { 
            background: #000; 
            border: 2px solid var(--p); 
            padding: 20px; 
            border-radius: 12px; 
            font-size: 1.2rem; 
            font-weight: bold; 
            margin: 20px 0; 
            color: #fff; 
            cursor: pointer;
            word-break: break-all;
            transition: 0.3s;
        }
        .email-box:active { transform: scale(0.95); background: #0a0a0a; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .btn { 
            border: none; 
            padding: 15px; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 14px; 
            transition: 0.2s;
            color: #fff;
        }
        .btn-p { background: var(--p); }
        .btn-s { background: #333; }
        .btn:active { opacity: 0.8; }

        /* Area Pesan Full Width */
        .inbox-container { 
            width: 100%; 
            max-width: 600px; 
            margin-top: 30px;
        }
        .inbox-header { 
            font-size: 14px; 
            font-weight: bold; 
            color: var(--p); 
            margin-bottom: 15px; 
            padding-left: 5px;
            display: flex;
            justify-content: space-between;
        }

        .mail-card { 
            background: #111; 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 12px; 
            border: 1px solid #222;
            border-left: 4px solid var(--p);
            animation: slideIn 0.3s ease-out;
        }
        .mail-from { font-size: 12px; color: var(--p); margin-bottom: 5px; }
        .mail-sub { font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        .mail-body { 
            background: #050505; 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 14px; 
            line-height: 1.5;
            color: #bbb;
            border: 1px solid #1a1a1a;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        
        #loading-bar { display: none; }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="logo">YUDA TEMP MAIL</a>
    <a href="index.html" class="back">KEMBALI</a>
</nav>

<div class="wrapper">
    <div class="card">
        <h2 style="margin:0; font-size: 1.4rem;">🛡️ Premium Account</h2>
        <p style="color: #666; font-size: 13px; margin-top: 5px;">Klik alamat di bawah untuk salin otomatis</p>
        
        <div class="email-box" id="addr-text" onclick="copyEmail()">Memuat...</div>
        
        <div class="btn-group">
            <button class="btn btn-p" onclick="createNew()">EMAIL BARU</button>
            <button class="btn btn-s" onclick="checkMessages()">CEK OTP</button>
        </div>
    </div>

    <div class="inbox-container">
        <div class="inbox-header">
            <span>KOTAK MASUK</span>
            <span id="sync-status" style="font-weight: normal; color: #444;">Otomatis...</span>
        </div>
        <div id="mail-list">
            <p style="text-align: center; color: #333; margin-top: 40px;">Belum ada OTP yang terdeteksi.</p>
        </div>
    </div>
</div>

<script>
    let token = ""; let address = "";

    async function createNew() {
        const textDisplay = document.getElementById('addr-text');
        textDisplay.innerText = "Generating...";
        try {
            const domainRes = await fetch('https://api.mail.tm/domains');
            const domainData = await domainRes.json();
            const domain = domainData['hydra:member'][0].domain;
            const user = `blakatak_${Math.random().toString(36).substring(2, 9)}`;
            address = `${user}@${domain}`;
            
            await fetch('https://api.mail.tm/accounts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ address, password: user })
            });

            const tokenRes = await fetch('https://api.mail.tm/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ address, password: user })
            });
            const tokenData = await tokenRes.json();
            token = tokenData.token;

            textDisplay.innerText = address;
            document.getElementById('mail-list').innerHTML = '<p style="text-align: center; color: #555; margin-top: 40px;">Email Aktif. Menunggu OTP...</p>';
        } catch (e) { textDisplay.innerText = "berhasil"; }
    }

    async function checkMessages() {
        if (!token) return;
        document.getElementById('sync-status').innerText = "Mengecek...";
        try {
            const res = await fetch('https://api.mail.tm/messages', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            const mails = data['hydra:member'];
            if (mails.length > 0) {
                let html = "";
                for (let m of mails) {
                    const msgRes = await fetch(`https://api.mail.tm/messages/${m.id}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const msg = await msgRes.json();
                    html += `<div class="mail-card">
                        <div class="mail-from">DARI: ${msg.from.address}</div>
                        <div class="mail-sub">${msg.subject}</div>
                        <div class="mail-body">${msg.intro || msg.text}</div>
                    </div>`;
                }
                document.getElementById('mail-list').innerHTML = html;
            }
        } catch (e) { console.log("Cek gagal"); }
        setTimeout(() => { document.getElementById('sync-status').innerText = "Otomatis..."; }, 1000);
    }

    function copyEmail() {
        if(!address || address === "Memuat...") return;
        navigator.clipboard.writeText(address);
        alert("Email Tersalin!");
    }

    // Init
    createNew();
    setInterval(checkMessages, 5000); // Cek otomatis tiap 5 detik
</script>

</body>
</html>
